<script>
  (() => {
    const P = "modulex-acilis-once-sonra";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const onceSonra = (s, P) => {
        const r = s.querySelector("input[data-kiyas]");
        const k = s.querySelector("." + P + "-kiyas");
        if (!r || !k) return;
        s.classList.add(P + "--kjs");
        const yaz = () => { k.style.setProperty("--konum", r.value + "%"); };
        r.addEventListener("input", yaz);
        yaz();
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      onceSonra(s, P, az);
    });
  })();
</script>
